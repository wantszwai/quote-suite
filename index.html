<html lang=&quot;en&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>Logitech Quote Builder</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#F3F1EC;color:#1a1a1a;font-size:14px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 2px;display:flex;align-items:center;gap:9px}
.logo{width:22px;height:22px;background:#0D3A38;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.sub{color:#6b7280;font-size:12.5px;margin:0 0 18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#374151;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.03em}
input,select{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#111}
input:focus,select:focus{outline:none;border-color:#0D3A38;box-shadow:0 0 0 3px rgba(0,253,207,.35)}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;color:#374151}
.seg button.on{background:#0D3A38;color:#fff;font-weight:600}
.seg button+button{border-left:1px solid #d1d5db}
.searchwrap{position:relative;flex:1;min-width:260px}
#search{width:100%}
.drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d1d5db;border-top:none;border-radius:0 0 8px 8px;max-height:280px;overflow:auto;z-index:20;display:none;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.drop.show{display:block}
.opt{padding:8px 11px;cursor:pointer;border-bottom:1px solid #f1f1f1;display:flex;justify-content:space-between;gap:10px}
.opt:hover,.opt.hl{background:#D6F5F0}
.opt .p{font-weight:600;color:#111}
.opt .d{color:#555;font-size:12.5px}
.opt .pr{color:#0D3A38;font-weight:600;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid #edeff2}
th{background:#f8f9fb;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.ctr,th.ctr{text-align:center}
tr.total td{font-weight:700;background:#D6F5F0;border-top:2px solid #a9e3da}
tr.section td{background:#e8f2f0;font-weight:700;color:#374151;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tr.rev td{background:#fff7e6}
.revbadge{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#b06a00;background:#ffe9bf;border-radius:10px;padding:1px 7px;vertical-align:middle}
.accbtn{border:1px solid #a9e3da;background:#eef7f5;color:#0D3A38;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;cursor:pointer;margin-right:6px;font-family:inherit}
.accbtn:hover{background:#D6F5F0}
.qty{width:52px;padding:5px 6px;text-align:center}
.del{color:#c0392b;cursor:pointer;font-weight:700;border:none;background:none;font-size:15px;padding:0 4px}
.empty{color:#9ca3af;text-align:center;padding:22px;font-style:italic}
.btn{background:#0D3A38;color:#fff;border:none;padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#0a2e2c}
.btn.ghost{background:#fff;color:#0D3A38;border:1px solid #a9e3da}
.btn.ghost:hover{background:#D6F5F0}
.tblhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;background:#D6F5F0;color:#0D3A38;border:1px solid #a9e3da;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;color:#9ca3af;margin-top:8px}
.caseform{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.caseform{grid-template-columns:1fr}}
.foot{color:#9ca3af;font-size:11.5px;text-align:center;margin:6px 0 30px}
</style>
</head>

      </div>
    </div>
  </div>

  <div class=&quot;card&quot;>
    <div class=&quot;tblhead&quot;>
      <h2 style=&quot;margin:0&quot;>3 &amp;middot; Price Table</h2>

        <span class=&quot;pill&quot; id=&quot;tierPill&quot;>Principal &amp;middot; Case Reg</span>
        <label style=&quot;font-size:12px;color:#374151;cursor:pointer;margin-right:4px&quot;><input type=&quot;checkbox&quot; id=&quot;inclTotal&quot; checked onchange=&quot;render()&quot; style=&quot;vertical-align:middle&quot;> Include total</label>

        <button class=&quot;btn ghost&quot; onclick=&quot;clearAll()&quot; style=&quot;border-color:#f2c6c2;color:#c0392b&quot;>Clear</button>
      </div>
    </div>
    <div id=&quot;priceWrap&quot;></div>
  </div>

  <div class=&quot;card&quot;>
    <div class=&quot;tblhead&quot;>
      <h2 style=&quot;margin:0&quot;>4 &amp;middot; Case Table</h2>

  </div>

$(&quot;#modeSeg&quot;).addEventListener(&quot;click&quot;,e=>{if(e.target.dataset.m){mode=e.target.dataset.m;[...$(&quot;#modeSeg&quot;).children].forEach(b=>b.classList.toggle(&quot;on&quot;,b===e.target));render();}});

// search
const search=$(&quot;#search&quot;), drop=$(&quot;#drop&quot;);
let hl=-1, results=[];
function doSearch(){
  const q=search.value.trim().toLowerCase();
  if(!q){drop.classList.remove(&quot;show&quot;);return;}
  results=CATALOG.filter(p=>p.part.toLowerCase().includes(q)||(p.desc||&quot;&quot;).toLowerCase().includes(q)).slice(0,40);
  drop.innerHTML=results.map((p,i)=>`<div class=&quot;opt&quot; data-i=&quot;${i}&quot;><span><span class=&quot;p&quot;>${p.part}</span> &amp;nbsp;<span class=&quot;d&quot;>${p.desc}</span></span><span class=&quot;pr&quot;>HK$ ${fmt(price(p))}</span></div>`).join(&quot;&quot;)||'<div class=&quot;opt&quot;><span class=&quot;d&quot;>No match</span></div>';
  drop.classList.add(&quot;show&quot;);hl=-1;
}
search.addEventListener(&quot;input&quot;,doSearch);
search.addEventListener(&quot;focus&quot;,doSearch);
search.addEventListener(&quot;keydown&quot;,e=>{
  const opts=[...drop.querySelectorAll(&quot;.opt[data-i]&quot;)];
  if(e.key===&quot;ArrowDown&quot;){hl=Math.min(hl+1,opts.length-1);e.preventDefault();}
  else if(e.key===&quot;ArrowUp&quot;){hl=Math.max(hl-1,0);e.preventDefault();}
  else if(e.key===&quot;Enter&quot;){if(hl>=0&amp;&amp;results[hl]){addLine(results[hl].part);}e.preventDefault();return;}
  else return;
  opts.forEach((o,i)=>o.classList.toggle(&quot;hl&quot;,i===hl));

document.addEventListener(&quot;click&quot;,e=>{if(!e.target.closest(&quot;.searchwrap&quot;))drop.classList.remove(&quot;show&quot;);});

// Related-accessory map: main model SKU -> [accessory SKUs] (auto-added under the &quot;Accessories&quot; header)
const _RB=[&quot;952-000041&quot;,&quot;952-000044&quot;,&quot;939-001799&quot;,&quot;989-000430&quot;,&quot;952-000047&quot;,&quot;939-001647&quot;,&quot;952-000181&quot;]; // video bars
const _HUD=[&quot;952-000146&quot;,&quot;952-000147&quot;,&quot;993-002979&quot;,&quot;993-002980&quot;,&quot;993-002982&quot;,&quot;952-000044&quot;,&quot;952-000041&quot;];

const ACCMAP={
  &quot;960-001312&quot;:_RB,&quot;960-001324&quot;:_RB,          // Rally Bar
  &quot;960-001340&quot;:_RB,&quot;960-001352&quot;:_RB,          // Rally Bar Mini

};
function addLine(part){

function addAccessories(part){
  (ACCMAP[part]||[]).forEach(a=>{if(CATALOG.find(c=>c.part===a)&amp;&amp;!lines.find(l=>l.part===a))lines.push({part:a,qty:1,opt:false,acc:true});});
  render();toast(&quot;Accessories added&quot;);
}
function setQty(part,q){const l=lines.find(x=>x.part===part);if(l){l.qty=Math.max(1,+q||1);render();}}
function setOpt(part,v){const l=lines.find(x=>x.part===part);if(l){l.opt=!!v;render();}}

// ---- Paste-a-list -> quote ----
const _STOP=new Set(&quot;logitech vc conferencing camera system accessories the a&quot;.split(&quot; &quot;));
const _COLORS=new Set(&quot;graphite white off silver rose black grey gray pale space&quot;.split(&quot; &quot;));
const _ACC=new Set(&quot;warranty spare cover holster remote adapter splitter dongle shade replacement bracket cart mounting mount cable extension hub pendant button wall riser angle clean fabric host privacy power faster coupler&quot;.split(&quot; &quot;));
function _toks(s){return (s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(t=>!_STOP.has(t));}
function _baseC(desc){return _toks(desc).filter(t=>!_COLORS.has(t)).join(&quot;&quot;);}
function parseListLine(raw){
  let s=(raw||&quot;&quot;).trim(); if(!s) return {name:&quot;&quot;,qty:1};
  s=s.replace(/^\s*[\-\*•]?\s*\d+[\.\)]\s*/,&quot;&quot;);         // leading &quot;1.&quot; / &quot;-&quot; numbering
  s=s.replace(/[;,\.]+\s*(and)?\s*$/i,&quot;&quot;).trim();        // trailing ; , . and
  s=s.replace(/\band$/i,&quot;&quot;).trim();
  let qty=1;
  const m=s.match(/[x*×]\s*(\d+)\s*$/i);
  if(m){qty=parseInt(m[1])||1; s=s.slice(0,m.index);}
  s=s.replace(/[\s\*x×:\-]+$/i,&quot;&quot;).trim();
  return {name:s, qty:Math.max(1,qty)};
}
function matchItem(name){
  const qt=_toks(name); if(!qt.length) return null;
  const qc=qt.join(&quot;&quot;); const qset=new Set(qt);
  let scored=CATALOG.map(c=>{
    const ct=_toks(c.desc); const cf=ct.join(&quot;&quot;); const cb=_baseC(c.desc);
    let s;
    if(qc===cb||qc===cf) s=100;
    else if(cb.startsWith(qc)||cf.startsWith(qc)) s=90;
    else if(cf.includes(qc)) s=82;
    else{
      const cset=new Set(ct); let inter=0; qset.forEach(t=>{if(cset.has(t))inter++;});
      if(!inter) return {s:-1};
      const cov=inter/qset.size, allQ=inter===qset.size, extra=ct.filter(t=>!qset.has(t)).length;
      s=cov*70+(allQ?15:0)-extra*2;
    }
    let pen=0; new Set(ct).forEach(t=>{if(_ACC.has(t)&amp;&amp;!qset.has(t))pen+=20;}); s-=pen;
    if(/conferencing camera system/i.test(c.desc)) s+=8;
    return {s,c,cb};
  }).filter(x=>x.s>-1).sort((a,b)=>b.s-a.s);
  if(!scored.length||scored[0].s<45) return null;
  const best=scored[0].s;
  const topgrp=scored.filter(x=>Math.abs(x.s-best)<=1);
  const sameBase=topgrp.filter(x=>x.cb===scored[0].cb);
  const colRe=/(graphite|off-white|white|silver|rose|black|grey|space black)/i;
  const pick=sameBase.find(x=>/graphite/i.test(x.c.desc))||sameBase.find(x=>!colRe.test(x.c.desc))||scored[0];
  const colorChoice=new Set(sameBase.map(x=>{const m=x.c.desc.match(colRe);return m?m[1].toLowerCase():&quot;&quot;;}).filter(Boolean)).size>1;
  const closeOther=scored.some(x=>x.cb!==scored[0].cb &amp;&amp; x.s>=best-6);
  return {item:pick.c, score:best, review:(best<85||colorChoice||closeOther)};
}
function generateFromList(){
  const txt=$(&quot;#pasteList&quot;).value;
  if(!txt.trim()){toast(&quot;Paste a list first&quot;);return;}
  let added=0, review=0, notfound=[];
  txt.split(/\r?\n/).forEach(raw=>{
    const {name,qty}=parseListLine(raw);
    if(!name) return;
    const res=matchItem(name);
    if(!res){ notfound.push(name); return; }
    const ex=lines.find(l=>l.part===res.item.part);
    if(ex){ex.qty+=qty; if(res.review)ex.review=true;}
    else lines.push({part:res.item.part,qty:qty,opt:false,review:res.review});
    added++; if(res.review) review++;
  });
  render();
  let msg=`Added ${added} line${added!==1?&quot;s&quot;:&quot;&quot;}.`;
  if(review) msg+=` ${review} flagged for review (highlighted).`;
  if(notfound.length) msg+=` Not found: ${notfound.join(&quot;; &quot;)}.`;
  const el=$(&quot;#pasteMsg&quot;); el.textContent=msg;
  el.style.color = notfound.length?&quot;#c0392b&quot;:(review?&quot;#b06a00&quot;:&quot;#0a8a3a&quot;);
  toast(added+&quot; item(s) added&quot;);
}
function del(part){lines=lines.filter(l=>l.part!==part);render();}
function clearAll(){lines=[];[&quot;cReseller&quot;,&quot;cDomain&quot;,&quot;cEnd&quot;].forEach(id=>{const el=$(&quot;#&quot;+id);if(el)el.value=&quot;&quot;;});search.value=&quot;&quot;;drop.classList.remove(&quot;show&quot;);render();toast(&quot;Cleared — ready for a new case&quot;);}

// short model name for the case model-list cell
function shortName(desc){
  return (desc||&quot;&quot;).replace(/\s*[-–]\s*(GRAPHITE|OFF-WHITE|SILVER|WHITE|GREY|GRAPHITE\s*)/i,&quot;&quot;)
    .replace(/Conferencing Camera System/i,&quot;&quot;).replace(/\s{2,}/g,&quot; &quot;).trim();
}

$(&quot;#cDomain&quot;).addEventListener(&quot;input&quot;,e=>{
  const v=e.target.value;const m=v.match(/@([^\s>]+)/)||[null,v];
  let host=(m[1]||&quot;&quot;).split(&quot;/&quot;)[0];
  if(!host)return;
  let core=host.split(&quot;.&quot;)[0].replace(/[-_]/g,&quot; &quot;);
  core=core.replace(/\b\w/g,c=>c.toUpperCase());
  if(core)$(&quot;#cReseller&quot;).value=core;
});

function render(){
  $(&quot;#tierPill&quot;).textContent=basisLabel();
  const _pb=$(&quot;#priceBasis&quot;);if(_pb)_pb.textContent=customPct()!=null?(&quot;Reseller price = MSRP − &quot;+customPct()+&quot;% (custom, overrides tier)&quot;):(&quot;Reseller price basis: &quot;+basisLabel());
  const _cp=$(&quot;#custPct&quot;);if(_cp)_cp.style.borderColor=customPct()!=null?&quot;#0D3A38&quot;:&quot;&quot;;
  // PRICE TABLE
  if(!lines.length){$(&quot;#priceWrap&quot;).innerHTML='<div class=&quot;empty&quot;>No items yet — search above to add products.</div>';}
  else{
    const inclTotal=!($(&quot;#inclTotal&quot;)&amp;&amp;!$(&quot;#inclTotal&quot;).checked);
    const inclOpt=!($(&quot;#inclOpt&quot;)&amp;&amp;!$(&quot;#inclOpt&quot;).checked);
    const ncol=6+2;
    const mkRow=(l)=>{
      const p=CATALOG.find(c=>c.part===l.part);const pr=price(p);const lt=(pr||0)*l.qty;
      return {lt, html:`<tr class=&quot;${l.review?'rev':''}&quot;><td>${p.part}</td><td>${p.desc}${l.review?'<span class=&quot;revbadge noprint&quot;>review</span>':''}</td><td class=&quot;num&quot;>${fmt(p.msrp)}</td><td class=&quot;num&quot;>${p.warr??&quot;—&quot;}</td><td class=&quot;num&quot;>${fmt(pr)}</td>
      <td class=&quot;num&quot;><input class=&quot;qty&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;${l.qty}&quot; onchange=&quot;setQty('${p.part}',this.value)&quot;></td>
      <td class=&quot;noprint ctr&quot;><input type=&quot;checkbox&quot; ${l.opt?&quot;checked&quot;:&quot;&quot;} title=&quot;Mark optional&quot; onchange=&quot;setOpt('${p.part}',this.checked)&quot;></td><td class=&quot;noprint&quot;>${(!l.acc&amp;&amp;!l.opt&amp;&amp;ACCMAP[p.part])?('<button class=&quot;accbtn&quot; title=&quot;Add related accessories&quot; onclick=&quot;addAccessories(\''+p.part+'\')&quot;>+ Acc</button>'):''}<button class=&quot;del&quot; onclick=&quot;del('${p.part}')&quot;>×</button></td></tr>`};
    };
    const mains=lines.filter(l=>!l.opt&amp;&amp;!l.acc), accs=lines.filter(l=>!l.opt&amp;&amp;l.acc), opts=lines.filter(l=>l.opt);
    let mainAmt=0,accAmt=0,optAmt=0,rows=&quot;&quot;;
    mains.forEach(l=>{const r=mkRow(l);mainAmt+=r.lt;rows+=r.html;});
    if(accs.length){
      rows+=`<tr class=&quot;section&quot;><td colspan=&quot;${ncol}&quot;>Accessories</td></tr>`;
      accs.forEach(l=>{const r=mkRow(l);accAmt+=r.lt;rows+=r.html;});
    }
    if(opts.length){
      rows+=`<tr class=&quot;section&quot;><td colspan=&quot;${ncol}&quot;>Optional Items</td></tr>`;
      opts.forEach(l=>{const r=mkRow(l);optAmt+=r.lt;rows+=r.html;});
    }
    const total=mainAmt+accAmt+(inclOpt?optAmt:0);
    const noteOpt=opts.length?(inclOpt?&quot; (incl. optional)&quot;:&quot; (main only)&quot;):&quot;&quot;;
    const totRow=inclTotal?`<tr class=&quot;total&quot;><td colspan=&quot;6&quot; style=&quot;text-align:right&quot;>Total Amount (HK$ Billing)${noteOpt}: ${fmt(total)}</td><td class=&quot;noprint&quot;></td><td class=&quot;noprint&quot;></td></tr>`:&quot;&quot;;
    $(&quot;#priceWrap&quot;).innerHTML=`<table id=&quot;priceTbl&quot;><thead><tr><th>Part No.</th><th>Description</th><th class=&quot;num&quot;>MSRP HK$</th><th class=&quot;num&quot;>Warranty (yr)</th><th class=&quot;num&quot;>Reseller Price HK$/Unit</th><th class=&quot;num&quot;>QTY</th><th class=&quot;noprint ctr&quot;>Opt</th><th class=&quot;noprint&quot;></th></tr></thead>
    <tbody>${rows}${totRow}</tbody></table>`;
  }
  // CASE TABLE
  const modelList=lines.map(l=>{const p=CATALOG.find(c=>c.part===l.part);return shortName(p.desc)+&quot; x&quot;+l.qty+(l.opt?&quot; (optional)&quot;:&quot;&quot;);}).join(&quot;<br>&quot;);
  let dp=0,bill=0;lines.forEach(l=>{const p=CATALOG.find(c=>c.part===l.part);dp+=(p.dp||0)*l.qty;bill+=(price(p)||0)*l.qty;});
  const R=$(&quot;#cReseller&quot;).value||&quot;—&quot;,D=$(&quot;#cDist&quot;).value,E=$(&quot;#cEnd&quot;).value||&quot;—&quot;;
  $(&quot;#caseWrap&quot;).innerHTML=`<table id=&quot;caseTbl&quot;><thead><tr><th>Reseller</th><th>Distributor</th><th>End User / Project</th><th>Model List</th><th class=&quot;num&quot;>DP USD</th><th class=&quot;num&quot;>Amount HKD Billing</th></tr></thead>
  <tbody><tr><td>${R}</td><td>${D}</td><td>${E}</td><td style=&quot;white-space:pre-line&quot;>${modelList||&quot;—&quot;}</td><td class=&quot;num&quot;>${fmt(dp)}</td><td class=&quot;num&quot;>${fmt(bill)}</td></tr></tbody></table>`;
}
[&quot;cReseller&quot;,&quot;cDist&quot;,&quot;cEnd&quot;].forEach(id=>$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,render));

function toast(t){const el=$(&quot;#toast&quot;);el.textContent=t;el.classList.add(&quot;show&quot;);setTimeout(()=>el.classList.remove(&quot;show&quot;),1600);}
function styleForEmail(clone){
  clone.style.borderCollapse=&quot;collapse&quot;;clone.style.fontFamily=&quot;Arial,Helvetica,sans-serif&quot;;clone.style.fontSize=&quot;13px&quot;;
  clone.querySelectorAll(&quot;th&quot;).forEach(el=>{el.style.background=&quot;#0D3A38&quot;;el.style.color=&quot;#ffffff&quot;;el.style.fontWeight=&quot;700&quot;;el.style.padding=&quot;8px 10px&quot;;el.style.border=&quot;1px solid #cfd8e0&quot;;el.style.textAlign=el.classList.contains(&quot;num&quot;)?&quot;right&quot;:el.classList.contains(&quot;ctr&quot;)?&quot;center&quot;:&quot;left&quot;;});

  clone.querySelectorAll(&quot;tr.section td&quot;).forEach(el=>{el.style.background=&quot;#e8f2f0&quot;;el.style.fontWeight=&quot;700&quot;;el.style.color=&quot;#374151&quot;;});
}
async function copyTbl(sel,label,noHeader,noStyle){
  const t=document.querySelector(sel);if(!t){toast(&quot;Add items first&quot;);return;}
  const clone=t.cloneNode(true);
  clone.querySelectorAll(&quot;input&quot;).forEach(i=>{const td=i.closest(&quot;td&quot;);if(td)td.textContent=i.value;});
  clone.querySelectorAll(&quot;.noprint&quot;).forEach(el=>el.remove());
  const _hc=(clone.querySelector(&quot;thead tr&quot;)||{children:[]}).children.length;clone.querySelectorAll(&quot;tbody tr&quot;).forEach(tr=>{const _f=tr.firstElementChild;if(_f&amp;&amp;_f.hasAttribute(&quot;colspan&quot;))_f.setAttribute(&quot;colspan&quot;,_hc-(tr.children.length-1));});
  if(noStyle){clone.removeAttribute(&quot;style&quot;);clone.querySelectorAll(&quot;[style]&quot;).forEach(el=>el.removeAttribute(&quot;style&quot;));clone.querySelectorAll(&quot;[class]&quot;).forEach(el=>el.removeAttribute(&quot;class&quot;));}
  else styleForEmail(clone);
  if(noHeader){const _th=clone.querySelector(&quot;thead&quot;);if(_th)_th.remove();}
  const html=clone.outerHTML, plain=clone.innerText;
  const holder=document.createElement(&quot;div&quot;);holder.style.cssText=&quot;position:fixed;left:-9999px;top:0&quot;;holder.appendChild(clone);document.body.appendChild(holder);
  try{await navigator.clipboard.write([new ClipboardItem({&quot;text/html&quot;:new Blob([html],{type:&quot;text/html&quot;}),&quot;text/plain&quot;:new Blob([plain],{type:&quot;text/plain&quot;})})]);toast(label+&quot; copied — paste into your email&quot;);}
  catch(e){const r=document.createRange();r.selectNode(clone);getSelection().removeAllRanges();getSelection().addRange(r);try{document.execCommand(&quot;copy&quot;);}catch(_){}getSelection().removeAllRanges();toast(label+&quot; copied&quot;);}
  finally{document.body.removeChild(holder);}
}
function copyPrice(){copyTbl(&quot;#priceTbl&quot;,&quot;Price Table&quot;);}
function copyCase(){copyTbl(&quot;#caseTbl&quot;,&quot;Case Table&quot;,true);}

  <div class=&quot;card&quot;>

let lines=[]; // {sku, qty, disc}
const $=s=>document.querySelector(s);
const fmt=n=>n==null?&quot;—&quot;:Number(n).toLocaleString(&quot;en-US&quot;,{maximumFractionDigits:2});
const bySku=Object.fromEntries(CATALOG.map(p=>[p.sku,p]));
function customPct(){const v=parseFloat($(&quot;#custPct&quot;)&amp;&amp;$(&quot;#custPct&quot;).value);return (isFinite(v)&amp;&amp;v>0)?v:null;}
function resPrice(p){const c=customPct();if(c!=null){if(p.msrp!=null&amp;&amp;p.b2bd!=null)return Math.round(p.msrp*(1-(p.b2bd+c)/100));return (p.b2b!=null?p.b2b:null);}return (p.b2b!=null?p.b2b:null);}

// categories
const cats=[...new Set(CATALOG.map(p=>p.ptype).filter(Boolean))].sort();
$(&quot;#cat&quot;).insertAdjacentHTML(&quot;beforeend&quot;,cats.map(c=>`<option value=&quot;${c}&quot;>${c}</option>`).join(&quot;&quot;));
$(&quot;#cat&quot;).addEventListener(&quot;change&quot;,doSearch);
$(&quot;#custPct&quot;).addEventListener(&quot;input&quot;,()=>{render();doSearch();});

// search
const search=$(&quot;#search&quot;), drop=$(&quot;#drop&quot;);
let hl=-1, results=[];
function doSearch(){
  const q=search.value.trim().toLowerCase();
  const cat=$(&quot;#cat&quot;).value;
  if(!q &amp;&amp; !cat){drop.classList.remove(&quot;show&quot;);return;}
  results=CATALOG.filter(p=>{
    if(cat &amp;&amp; p.ptype!==cat) return false;
    if(!q) return true;
    return p.sku.toLowerCase().includes(q)||(p.model||&quot;&quot;).toLowerCase().includes(q)||(p.name||&quot;&quot;).toLowerCase().includes(q);
  }).slice(0,60);
  drop.innerHTML=results.map((p,i)=>`<div class=&quot;opt&quot; data-i=&quot;${i}&quot;><span><span class=&quot;p&quot;>${p.sku}</span> &amp;nbsp;<span class=&quot;d&quot;>${p.name||p.model}</span> <span class=&quot;tag&quot;>· ${p.ptype}</span></span><span class=&quot;pr&quot;>HK$ ${fmt(resPrice(p))}</span></div>`).join(&quot;&quot;)||'<div class=&quot;opt&quot;><span class=&quot;d&quot;>No match</span></div>';
  drop.classList.add(&quot;show&quot;);hl=-1;
}
search.addEventListener(&quot;input&quot;,doSearch);
search.addEventListener(&quot;focus&quot;,doSearch);
search.addEventListener(&quot;keydown&quot;,e=>{
  const opts=[...drop.querySelectorAll(&quot;.opt[data-i]&quot;)];
  if(e.key===&quot;ArrowDown&quot;){hl=Math.min(hl+1,opts.length-1);e.preventDefault();}
  else if(e.key===&quot;ArrowUp&quot;){hl=Math.max(hl-1,0);e.preventDefault();}
  else if(e.key===&quot;Enter&quot;){if(hl>=0&amp;&amp;results[hl])addLine(results[hl].sku);e.preventDefault();return;}
  else return;
  opts.forEach((o,i)=>o.classList.toggle(&quot;hl&quot;,i===hl));
  if(opts[hl])opts[hl].scrollIntoView({block:&quot;nearest&quot;});
});
drop.addEventListener(&quot;click&quot;,e=>{const o=e.target.closest(&quot;.opt[data-i]&quot;);if(o&amp;&amp;results[+o.dataset.i])addLine(results[+o.dataset.i].sku);});
document.addEventListener(&quot;click&quot;,e=>{if(!e.target.closest(&quot;.searchwrap&quot;))drop.classList.remove(&quot;show&quot;);});

function addLine(sku){
  const ex=lines.find(l=>l.sku===sku);
  if(ex)ex.qty++;
  else lines.push({sku,qty:1});
  search.value=&quot;&quot;;drop.classList.remove(&quot;show&quot;);render();
}
function setQty(sku,q){const l=lines.find(x=>x.sku===sku);if(l){l.qty=Math.max(1,+q||1);render();}}
function setDisc(sku,d){const l=lines.find(x=>x.sku===sku);if(l){l.disc=Math.min(100,Math.max(0,+d||0));render();}}
function del(sku){lines=lines.filter(l=>l.sku!==sku);render();}
function clearAll(){lines=[];search.value=&quot;&quot;;drop.classList.remove(&quot;show&quot;);render();toast(&quot;Cleared — ready for a new case&quot;);}

function render(){
  $(&quot;#cntPill&quot;).textContent=lines.length+(lines.length===1?&quot; item&quot;:&quot; items&quot;);
  if(!lines.length){$(&quot;#quoteWrap&quot;).innerHTML='<div class=&quot;empty&quot;>No items yet — search above to add products.</div>';renderCase();return;}
  const inclTotal=!($(&quot;#inclTotal&quot;)&amp;&amp;!$(&quot;#inclTotal&quot;).checked);
  let rows=&quot;&quot;,amt=0;
  lines.forEach(l=>{
    const p=bySku[l.sku];const rp=resPrice(p);const lt=(rp||0)*l.qty;amt+=lt;
    rows+=`<tr>
      <td>${p.sku}</td>
      <td>${p.name||p.model}</td>
      <td class=&quot;ctr&quot;>${p.warr||&quot;—&quot;}</td>
      <td class=&quot;num&quot;>${fmt(p.msrp)}</td>
      <td class=&quot;num&quot;>${fmt(rp)}</td>
      <td class=&quot;ctr&quot;><input class=&quot;qty&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;${l.qty}&quot; onchange=&quot;setQty('${p.sku}',this.value)&quot;></td>
      <td class=&quot;noprint&quot;><button class=&quot;del&quot; onclick=&quot;del('${p.sku}')&quot;>×</button></td></tr>`;
  });
  const totRow=inclTotal?`<tr class=&quot;total&quot;><td colspan=&quot;6&quot; style=&quot;text-align:right&quot;>Total Amount (HK$): ${fmt(amt)}</td><td class=&quot;noprint&quot;></td></tr>`:&quot;&quot;;
  $(&quot;#quoteWrap&quot;).innerHTML=`<table id=&quot;quoteTbl&quot;><thead><tr>
    <th>SKU Number</th><th>Model Name</th><th class=&quot;ctr&quot;>Warranty (yr)</th><th class=&quot;num&quot;>MSRP HK$</th><th class=&quot;num&quot;>Reseller Price HK$/Unit</th><th class=&quot;ctr&quot;>QTY</th><th class=&quot;noprint&quot;></th></tr></thead>
    <tbody>${rows}${totRow}</tbody></table>`;
  renderCase();
}

function renderCase(){
  const modelList=lines.map(l=>{const p=bySku[l.sku];return (p.model||p.name||l.sku)+&quot; x&quot;+l.qty;}).join(&quot;<br>&quot;);
  let dp=0,bill=0;
